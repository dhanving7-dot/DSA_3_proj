services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: allocatex
      POSTGRES_PASSWORD: allocatex
      POSTGRES_DB: allocatex
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U allocatex"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://allocatex:allocatex@postgres:5432/allocatex
      REDIS_URL: redis://redis:6379/0
      ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  postgres_data:
